<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07090d">
  <title>Endfield Protocol — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#07090d;color:#f7f9fc;font-family:ui-monospace,Consolas,monospace}.card{width:min(520px,100%);padding:28px;border:1px solid rgba(255,52,77,.42);border-radius:20px;background:linear-gradient(145deg,#151a22,#090c11);box-shadow:0 30px 90px rgba(0,0,0,.55)}small{color:#ff344d;letter-spacing:1.5px}h1{margin:12px 0 8px;font-family:system-ui,sans-serif;font-size:34px}p{color:#8993a1;font-size:12px;line-height:1.7}.bar{height:6px;margin:24px 0;border-radius:99px;background:#242a33;overflow:hidden}.bar span{display:block;width:42%;height:100%;background:linear-gradient(90deg,#ff344d,#ffbe63);animation:p 1.5s ease-in-out infinite}@keyframes p{50%{transform:translateX(140%)}}button{width:100%;min-height:44px;border:1px solid #ff344d;border-radius:11px;background:#ff344d;color:#fff;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body><main class="card"><small>ENDFIELD PROTOCOL // OFFLINE</small><h1>Command link unavailable</h1><p>Interface shell is cached. Sync and Check-in requests can be queued and retried when the network returns.</p><div class="bar"><span></span></div><button onclick="location.reload()">Retry Connection</button></main></body></html>
